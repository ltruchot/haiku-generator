# The full gate on every push and pull request. Render deploys master only
# after this check passes (render.yaml: autoDeployTrigger: checksPass).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust, the wasm target, wasm-bindgen, wasm-opt, cargo-audit (mise.toml, mise.lock).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      # Chromium for packages/e2e (Playwright).
      - run: vp -C packages/e2e exec playwright install --with-deps chromium
      - run: vp run ready
