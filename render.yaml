# Render Blueprint: one static site, the page of apps/web.
# scripts/render-build.sh builds it with its deploy base and nests it under
# site/loic-truchot/projects/haiku-generator/, so the published root mirrors
# the public URL.
services:
  - type: web
    runtime: static
    name: haiku-generator
    branch: master
    # Deploy only once .github/workflows/ci.yml (vp run ready) passed on master.
    autoDeployTrigger: checksPass
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: ./site
    # A push ending with a commit that touches only ignored paths may deploy
    # nothing, not even the code commits before it: push the code commit last,
    # or trigger a deploy by hand.
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - packages/e2e/**
        - tests/**
        - docs/**
        - todo/**
        - .claude/**
        - .github/**
      # No custom domain here: developers.gods.academy belongs to the hub service
      # (repo Gods-Academy/developers-hub), which rewrites
      # /loic-truchot/projects/haiku-generator/* to this site's onrender.com URL
      # (Render: one domain = one service). See docs/hub-patch/.
    routes:
      - type: redirect
        source: /
        destination: /loic-truchot/projects/haiku-generator/
    headers:
      # Security headers, every page. The page loads only its own files, with no
      # inline script or style. is what lets the browser
      # compile the WebAssembly module, and nothing else.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Content-hashed file names (Vite), and Tailwind with its version in its name.
      - path: /loic-truchot/projects/haiku-generator/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /loic-truchot/projects/haiku-generator/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
